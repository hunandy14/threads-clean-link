name: 自動發版

# 不加 paths 過濾:workflow 需在 version 未變的 push 上也能檢查缺 tag 的
# 補發情境;真正昂貴的步驟已由 tag 存在檢查短路。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# 避免兩個 run 同時打包/建立同一個 tag 的 release 互相打架:
# cancel-in-progress 刻意設 false,新的 run 會排隊等前一個跑完,而不是
# 把可能正在上傳 release 資產的舊 run 腰斬。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 簽出原始碼(含完整歷史與 tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 讀取 manifest.json 版本號
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          if (-not $version) {
            throw 'manifest.json 沒有 version 欄位'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 檢查對應 tag 是否已存在
        id: tagcheck
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已存在 tag $TAG,略過本次發版。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "尚無 tag $TAG,準備打包發版。"
          fi

      - name: 執行測試
        if: steps.tagcheck.outputs.exists == 'false'
        run: node --test test/*.test.js

      - name: 打包 Chrome Web Store 上架 zip
        if: steps.tagcheck.outputs.exists == 'false'
        shell: pwsh
        run: tools/build-release.ps1

      - name: 建立 GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/*.zip \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
