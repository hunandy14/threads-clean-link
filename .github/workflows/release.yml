name: 自動發版

# 不加 paths 過濾:workflow 需在 version 未變的 push 上也能檢查缺 tag 的
# 補發情境;真正昂貴的步驟已由 tag 存在檢查短路。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_only:
        description: >-
          僅重新打包並上傳 Chrome Web Store 草稿，略過建立 GitHub
          Release(用於審核通過後、tag 已存在時補上傳新草稿);除非同時
          勾選 skip_publish，否則上傳成功後仍會自動送審
        type: boolean
        default: false
      # 紀律提醒:新增權限的版本不要走自動發布——先勾選這個選項只上傳草稿，
      # 或乾脆先不合併進 main，改到開發者主控台手動送審並親自填寫新權限的
      # 使用理由文案(自動送審不會、也不該幫你編這段說明)。這個手動勾選是
      # 「提醒」而非唯一防線——push 觸發時根本沒有畫面可勾，真正的防線是
      # 下面「檢查是否新增權限」那個步驟:它會比對本次與上一版 manifest.json
      # 的 permissions/host_permissions，偵測到新增就自動跳過送審，不依賴
      # 人記得勾這個開關。
      skip_publish:
        description: >-
          略過自動送審(publish)，只做打包/上傳草稿。新增權限的版本、或想
          先人工檢查草稿再送審時開啟
        type: boolean
        default: false

permissions:
  contents: write

# 避免兩個 run 同時打包/建立同一個 tag 的 release 互相打架:
# cancel-in-progress 刻意設 false，新的 run 會排隊等前一個跑完，而不是
# 把可能正在上傳 release 資產的舊 run 腰斬。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 簽出原始碼(含完整歷史與 tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 讀取 manifest.json 版本號
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          if (-not $version) {
            throw 'manifest.json 沒有 version 欄位'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 檢查對應 tag 是否已存在
        id: tagcheck
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已存在 tag $TAG，略過本次發版。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "尚無 tag $TAG，準備打包發版。"
          fi

      # upload_only 補傳也要過測試:打包白名單防漏檔(test/package.test.js)
      # 正是要在「重打包上傳」的路徑上把關,不能只在新 tag 時跑。
      - name: 執行測試
        if: steps.tagcheck.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.upload_only == true)
        run: node --test test/*.test.js

      # 下面兩個條件式都多 or 了 upload_only 分支:讓「tag 已存在、只想
      # 補傳 CWS 草稿」的手動情境(過審後重跑)也能執行打包與上傳，同時不
      # 建立 Release。github.event_name 判斷是安全網:upload_only 這個
      # input 只有 workflow_dispatch 事件才有值，push 事件時 inputs context
      # 為空，先擋 event_name 就不會去讀一個不存在的 input。
      - name: 打包 Chrome Web Store 上架 zip
        if: steps.tagcheck.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.upload_only == true)
        shell: pwsh
        run: tools/build-release.ps1

      - name: 產生乾淨格式的 release notes
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          # 用 GitHub 原生的 generate-notes API 取得「## What's Changed」清單
          # (與 gh release create --generate-notes 底層同一支 API，會自動抓
          # 上一個 release 到現在合併的 PR)，但只留標題與 PR 編號、去掉
          # 「by @帳號 in 連結」與「## New Contributors」區塊，格式對齊 (A)
          # 手動整理過的 v0.2.0 release notes。
          RAW=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v${{ steps.version.outputs.version }}" --jq '.body')

          {
            echo "## 更新內容"
            echo "$RAW" | awk '/^## What.s Changed/{flag=1; next} /^## /{flag=0} flag && /^\* /' \
              | sed -E 's|^\* (.*) by @[^ ]+ in https://github\.com/[^/]+/[^/]+/pull/([0-9]+)$|- \1（#\2）|'
            echo ""
            echo "$RAW" | grep '^\*\*Full Changelog\*\*'
          } > release-notes.md

          echo "已產生 release notes:"
          cat release-notes.md

      - name: 建立 GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "dist/threads-clean-link-v${{ steps.version.outputs.version }}.zip" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md

      - name: 上傳新版草稿至 Chrome Web Store
        id: cws_upload
        if: steps.tagcheck.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.upload_only == true)
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          # 四把 CWS 憑證任一缺漏就優雅跳過:此步驟屬於「錦上添花」的自動
          # 上架，不應該讓整個發版流程因為還沒設定商店憑證而失敗。
          if [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || \
             [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_EXTENSION_ID" ]; then
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "未設定 CWS 憑證，跳過商店上傳。"
            exit 0
          fi
          echo "has_credentials=true" >> "$GITHUB_OUTPUT"

          ZIP_PATH="dist/threads-clean-link-v${{ steps.version.outputs.version }}.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "找不到打包好的 zip:$ZIP_PATH，無法上傳 Chrome Web Store。"
            exit 1
          fi

          # ---- 1) 用 refresh token 換一次性 access token ----
          # 安全性據實說明(不是「絕對不落地」):client_secret／refresh_token
          # 經環境變數展開後，仍會成為這行 curl 呼叫的命令列參數，執行期間
          # 理論上可被同一台機器上的 ps 看到；GitHub 託管 runner 是單租戶
          # 的臨時機，跑完即整台回收，這個暴露面可以接受，因此不改成
          # --header @file 之類的寫法。真正要顧的是別讓它落進我們自己印出
          # 的 log:$TOKEN_RESPONSE／access token 本身絕不 echo，只在失敗
          # 時取 Google 回傳的錯誤說明欄位印出，不印整包回應。
          #
          # GitHub Actions 預設以 bash -eo pipefail 執行 run 區塊:若回應不是
          # 合法 JSON，jq 解析失敗會讓管線非零結束，「2>/dev/null || true」
          # 讓這一行本身不觸發 errexit 提前中止，失敗只反映在變數為空，交由
          # 下面的 if 分支印出我們設計好的錯誤說明。
          TOKEN_RESPONSE=$(curl -sS -X POST 'https://oauth2.googleapis.com/token' \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')

          ACCESS_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.access_token // empty' 2>/dev/null || true)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "換取 access token 失敗:"
            TOKEN_ERROR_DETAIL=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '
              if .error_description then "  " + .error_description
              elif .error then "  " + .error
              else empty
              end' 2>/dev/null || true)
            if [ -n "$TOKEN_ERROR_DETAIL" ]; then
              echo "$TOKEN_ERROR_DETAIL"
            else
              echo "  (回應不是可解析的 JSON，無法取得錯誤說明)"
            fi
            exit 1
          fi

          # access token 換到手就立刻遮罩:之後任何 log 行只要含有這個字串，
          # GitHub 都會自動印成 ***，發布步驟要復用它時才敢放進 step output。
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          # ---- 2) 上傳 zip(成為商店草稿新版本，不呼叫 publish)----
          UPLOAD_RESPONSE=$(curl -sS -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'x-goog-api-version: 2' \
            -T "$ZIP_PATH" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")

          UPLOAD_STATE=$(printf '%s' "$UPLOAD_RESPONSE" | jq -r '.uploadState // empty' 2>/dev/null || true)
          if [ "$UPLOAD_STATE" != 'SUCCESS' ]; then
            echo "上傳 Chrome Web Store 失敗(uploadState=${UPLOAD_STATE:-無})"
            UPLOAD_ERROR_DETAIL=$(printf '%s' "$UPLOAD_RESPONSE" | jq -r '
              if .error.message then "  " + .error.message
              elif (.itemError // [] | length) > 0 then (.itemError[] | "  - " + (.error_detail // .error_code // tostring))
              else empty
              end' 2>/dev/null || true)
            if [ -n "$UPLOAD_ERROR_DETAIL" ]; then
              echo "$UPLOAD_ERROR_DETAIL"
            else
              echo "  (回應不是可解析的 JSON，無法取得錯誤說明)"
            fi
            exit 1
          fi

          echo "草稿已上傳(uploadState=SUCCESS)。"

      # 自動防線:push 觸發時沒有人會去勾 skip_publish，新增權限的版本若沒
      # 有這一關會被直接自動送審(見 workflow_dispatch.skip_publish 說明旁
      # 的紀律提醒——那只是「提醒」，不是強制)。這裡改用機器比對兜底:抓
      # 上一個版本 tag 的 manifest.json，跟本次 manifest.json 比對
      # permissions／host_permissions 兩個陣列，只要有新增項目就設旗標讓
      # 下面的送審步驟自動跳過，不依賴人記得手動勾選。
      - name: 檢查是否新增權限(新增時自動跳過送審)
        id: permcheck
        if: steps.tagcheck.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.upload_only == true)
        run: |
          CURRENT_TAG="v${{ steps.version.outputs.version }}"

          # 找「上一個版本」的 tag:依語意化版本排序所有 v* tag、排除本次
          # 版本自己的 tag 後取最新的一個。刻意不用
          # `git describe --tags --abbrev=0 HEAD^`——workflow_dispatch 的
          # upload_only 情境下 CURRENT_TAG 通常已經存在(補傳審過的版本)，
          # 此時 HEAD 就在該 tag 上，describe 找到的不保證是真正的上一版；
          # 用排序+排除自己則兩種觸發情境都適用。
          PREV_TAG=$(git tag --list 'v*' | grep -v "^${CURRENT_TAG}$" | sort -V | tail -n1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "找不到上一個版本的 tag(可能是第一次發版)，沒有基準可比對權限，略過本次檢查。"
            echo "has_new_permissions=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "上一個版本 tag:$PREV_TAG"

          if ! git show "${PREV_TAG}:manifest.json" > /tmp/prev-manifest.json 2>/dev/null; then
            echo "::warning::讀不到 $PREV_TAG 的 manifest.json，無法比對權限是否新增，為安全起見視為有新權限、跳過自動送審。"
            echo "has_new_permissions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 比對邏輯抽成獨立腳本(tools/check-new-permissions.py)而非寫成內嵌
          # heredoc:YAML 區塊純量的縮排規則跟 Python 對頂層程式碼「不能有
          # 前導空白」互斥，內嵌 heredoc 一縮排就會是 IndentationError；抽
          # 成檔案同時也讓這段比對邏輯可以離開 workflow 單獨本機測試。
          NEW_ITEMS=$(python3 tools/check-new-permissions.py /tmp/prev-manifest.json manifest.json)

          if [ -n "$NEW_ITEMS" ]; then
            NEW_ITEMS_ONELINE=$(printf '%s' "$NEW_ITEMS" | paste -sd ',' - | sed 's/,/, /g')
            echo "::warning::偵測到新權限，自動送審已跳過，請至主控台手動送審並填權限理由(新增項目:$NEW_ITEMS_ONELINE)"
            echo "has_new_permissions=true" >> "$GITHUB_OUTPUT"
          else
            echo "沒有偵測到新增的 permissions/host_permissions，照常自動送審。"
            echo "has_new_permissions=false" >> "$GITHUB_OUTPUT"
          fi

      # 只在「上傳步驟真的跑了且憑證齊全」時才嘗試發布，並額外開兩個閥門:
      # skip_publish 是人工主動選擇跳過;permcheck 的 has_new_permissions
      # 是機器比對出新權限時自動跳過，兩者任一成立都不送審，改到主控台手
      # 動送審並親自填寫新權限的使用理由文案。
      #
      # access token 復用上一步 cws_upload 的 step output，不重新用
      # refresh token 換發——同一次 run 沒必要換兩次。
      - name: 送審 Chrome Web Store 草稿
        if: >-
          (steps.tagcheck.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.upload_only == true)) &&
          steps.cws_upload.outputs.has_credentials == 'true' &&
          steps.permcheck.outputs.has_new_permissions != 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.skip_publish == true)
        env:
          CWS_ACCESS_TOKEN: ${{ steps.cws_upload.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -z "$CWS_ACCESS_TOKEN" ]; then
            echo "沒有可復用的 access token(上傳步驟未成功換發)，跳過送審。"
            exit 0
          fi

          # 安全性據實說明(不是「絕對不落地」):access token 經環境變數展開
          # 後，一樣會成為這行 curl 呼叫(-H 參數)的命令列參數，執行期間理論
          # 上可被同一台機器上的 ps 看到；GitHub 託管 runner 是單租戶的臨時
          # 機，跑完即整台回收，這個暴露面可以接受，不因此改寫 curl 呼叫
          # 方式。真正要顧的是別讓它落進我們自己印出的 log:回應本身不會
          # 回傳 token，可以整包印出方便除錯。
          PUBLISH_RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H 'x-goog-api-version: 2' \
            -H 'Content-Length: 0' \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish")

          HTTP_CODE=$(printf '%s' "$PUBLISH_RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$PUBLISH_RESPONSE" | sed '$d')

          echo "送審回應(HTTP $HTTP_CODE):"
          echo "$BODY"

          # 用 jq -c 保留原始 JSON 引號(如 ["OK"])再拿去 grep，比對「帶引號的
          # 整詞」而非裸字串:避免日後 Google 新增類似 NOT_OK 之類的狀態碼時，
          # 'OK' 這種寬鬆子字串比對誤判成功。
          STATUS_LIST=$(printf '%s' "$BODY" | jq -c '.status // []' 2>/dev/null || true)

          if [ "$HTTP_CODE" = '200' ] && printf '%s' "$STATUS_LIST" | grep -q '"OK"'; then
            echo "已成功送出審查，請至開發者主控台確認狀態。"
          elif printf '%s' "$STATUS_LIST" | grep -q '"ITEM_PENDING_REVIEW"'; then
            echo "::warning::此版本已在審查佇列中(ITEM_PENDING_REVIEW)，視為可重試情境，草稿已上傳成功，不視為本次執行失敗。前版審查通過後，手動執行 workflow_dispatch 的 upload_only 模式即可補送本版。"
          else
            echo "送審失敗(HTTP ${HTTP_CODE:-無}，status=${STATUS_LIST:-無})"
            exit 1
          fi
