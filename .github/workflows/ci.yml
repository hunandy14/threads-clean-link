name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一個 PR（或同一個分支）的新推送會取消仍在跑的舊 run，只保留最新一次結果。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出原始碼
        uses: actions/checkout@v5

      # repo 沒有 package-lock.json（無任何相依套件），因此不設 cache: npm，
      # 安裝步驟也用 npm install 而非 npm ci。
      - name: 設定 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝相依套件
        run: npm install

      - name: 執行測試
        run: npm test
