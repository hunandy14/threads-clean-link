<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Threads Clean Link</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e3e3e3;
    --accent: #0d6efd;
    --switch-track-off: #d0d3d9;
    --switch-thumb: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --fg: #f1f1f1;
      --muted: #a3a3a3;
      --border: #3a3b3d;
      --accent: #6ea8ff;
      --switch-track-off: #55575c;
      --switch-thumb: #e8e8e8;
    }
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    width: 280px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
  }
  header .version {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .settings {
    padding: 8px 14px 4px;
    display: flex;
    flex-direction: column;
  }
  /* 設定列：標籤在左、switch 靠右(flex + space-between)。這是 iOS HIG 的
     list row toggle 與 Material 3 list item「trailing slot」的共同慣例，
     NN/g 也建議窄欄位(設定面板正是)把 switch 放在標籤右側；LTR 的掃視
     順序與螢幕閱讀器都是先讀標籤再讀控件，標籤在左最不含糊。
     整列本身就是 <label>，點文字或列上任一處都能切換，不必精準命中
     34px 寬的 switch。 */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    cursor: pointer;
  }
  /* 標籤過長時在自己這一側折行，不把靠右的 switch 擠出列外。 */
  .setting-row-label {
    min-width: 0;
  }
  /* 滑動 switch：取消 checkbox 原生打勾外觀，自行畫軌道與滑塊。
     顏色一律走 CSS 變數（--switch-track-off / --switch-thumb / --accent），
     深淺色主題各自在 :root 覆寫變數值，這裡不得出現任何硬編色碼。 */
  .switch {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    width: 34px;
    height: 20px;
    margin: 0;
    /* 靠右的 switch 不得被左側標籤壓縮變形。 */
    flex-shrink: 0;
    border-radius: 999px;
    background: var(--switch-track-off);
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--switch-thumb);
    transition: transform 0.15s ease;
  }
  .switch:checked {
    background: var(--accent);
  }
  .switch:checked::before {
    transform: translateX(14px);
  }
  /* 導航列:沿用 .setting-row 的版式，但它是按鈕不是開關——右側放 chevron
     而非打勾控件(iOS 設定/Chrome 自家 popup 的慣例)，點了跳去 options 頁。
     這裡先重設 button 的原生外觀，flex 版式由 .setting-row 提供。 */
  .nav-row {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    border: none;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
  }
  .nav-chev {
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
  }
  footer {
    padding: 8px 14px 12px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <header>
    <h1>Threads Clean Link</h1>
    <span class="version" id="version"></span>
  </header>
  <div class="settings">
    <label class="setting-row" for="autoClean">
      <span class="setting-row-label" data-i18n="ppAutoClean">自動淨化分享按鈕</span>
      <input type="checkbox" id="autoClean" class="switch" />
    </label>
    <label class="setting-row" for="notifySuccess">
      <span class="setting-row-label" data-i18n="ppNotify">成功時顯示通知</span>
      <input type="checkbox" id="notifySuccess" class="switch" />
    </label>
    <button class="setting-row nav-row" id="openOptions" type="button">
      <span class="setting-row-label" data-i18n="ppHistorySettings">紀錄與設定</span>
      <span class="nav-chev" aria-hidden="true">›</span>
    </button>
  </div>
  <footer data-i18n="ppFooter">盡力而為，處理失敗不影響原功能。</footer>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
  <script src="popup-init.js"></script>
</body>
</html>
