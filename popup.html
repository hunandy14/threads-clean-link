<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Threads Clean Link</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Threads Clean Link</h1>
    <span class="version" id="version"></span>
  </header>
  <div class="settings">
    <label class="setting-row" for="autoClean">
      <span class="setting-row-label">
        <span class="name" data-i18n="ppAutoClean">自動淨化分享按鈕</span>
      </span>
      <input type="checkbox" id="autoClean" class="switch" />
    </label>
    <label class="setting-row" for="postCopyEnabled">
      <span class="setting-row-label" data-i18n="popPostCopyLabel">貼文複製按鈕</span>
      <input type="checkbox" id="postCopyEnabled" class="switch" />
    </label>
    <button class="setting-row nav-row" id="openOptions" type="button">
      <span class="setting-row-label" data-i18n="ppHistorySettings">紀錄與設定</span>
      <svg class="nav-chev" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
    </button>
  </div>
  <footer data-i18n="ppFooter">盡力而為，處理失敗不影響原功能。</footer>
  <script src="i18n.js"></script>
  <script src="tcl-core.js"></script>
  <script src="popup.js"></script>
  <script src="popup-init.js"></script>
</body>
</html>
