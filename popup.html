<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Threads Clean Link</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e3e3e3;
    --accent: #0d6efd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --fg: #f1f1f1;
      --muted: #a3a3a3;
      --border: #3a3b3d;
      --accent: #6ea8ff;
    }
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    width: 280px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
  }
  header .version {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .settings {
    padding: 8px 14px 4px;
    display: flex;
    flex-direction: column;
  }
  .setting-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
  }
  .setting-row.indent {
    margin-left: 22px;
  }
  .setting-row:has(input:disabled) {
    opacity: 0.5;
  }
  .setting-row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    margin: 0;
    flex: none;
    accent-color: var(--accent);
  }
  .setting-row label {
    cursor: pointer;
  }
  .setting-row:has(input:disabled) label {
    cursor: default;
  }
  .setting-hint {
    font-size: 11px;
    color: var(--muted);
    margin-left: 22px;
  }
  footer {
    padding: 8px 14px 12px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <header>
    <h1>Threads Clean Link</h1>
    <span class="version" id="version"></span>
  </header>
  <div class="settings">
    <div class="setting-row">
      <input type="checkbox" id="autoClean" />
      <label for="autoClean">自動淨化剪貼簿</label>
    </div>
    <div class="setting-row indent">
      <input type="checkbox" id="resolveShortcode" />
      <label for="resolveShortcode">短碼解析（需連網）</label>
    </div>
    <div class="setting-row">
      <input type="checkbox" id="notifySuccess" />
      <label for="notifySuccess">成功時顯示通知</label>
    </div>
  </div>
  <footer>失敗時一律放行原始連結，右鍵選單不受開關影響。</footer>
  <script src="popup.js"></script>
  <script>
    // 把真的 chrome.storage.sync 接上邏輯層；popup.js 本身不碰全域 chrome，
    // 才能在 Node 測試環境離線測試（見 popup.js 檔頭）。
    document.addEventListener('DOMContentLoaded', function () {
      var versionEl = document.getElementById('version');
      if (versionEl && typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.getManifest) {
        versionEl.textContent = 'v' + chrome.runtime.getManifest().version;
      }
      var controller = createPopupController({
        document: document,
        storage: chrome.storage.sync,
      });
      controller.init();
    });
  </script>
</body>
</html>
