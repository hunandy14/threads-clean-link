<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>脆連結清潔工 — 互動列複製按鈕</title>
<style>
  :root{
    --bg-page: rgb(16,16,16);
    --bg-card: rgb(24,24,24);
    --fg: rgb(243,245,247);
    --muted: rgb(119,119,119);
    --icon: rgb(204,204,204);
    --accent: #e2925e;
    --accent-ink: #17181b;
    --border: rgba(255,255,255,0.08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow:hidden;background:var(--bg-page);}
  body{font-family:var(--font);}
  .stage{
    width:1280px;height:800px;position:relative;overflow:hidden;
    background:
      radial-gradient(closest-side, rgba(226,146,94,0.10), transparent 70%) top right / 900px 900px no-repeat,
      var(--bg-page);
  }
  .glow{
    position:absolute; right:-140px; top:100px; width:760px; height:560px;
    background: radial-gradient(closest-side, rgba(226,146,94,0.20), rgba(226,146,94,0.06) 55%, transparent 75%);
    filter: blur(8px);
    pointer-events:none;
  }
  .inner{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:54px 68px 36px;
  }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; align-self:flex-start;
    background: rgba(226,146,94,0.14); color: var(--accent);
    font-size:15px; font-weight:700; letter-spacing:0.02em;
    padding:6px 14px; border-radius:999px; margin-bottom:18px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  h1{
    margin:0 0 14px; color:var(--fg); font-size:52px; font-weight:800;
    letter-spacing:-0.01em; line-height:1.18; max-width:900px;
  }
  h1 b{ color:var(--accent); font-weight:800; }
  .sub{
    margin:0; color:var(--muted); font-size:24px; line-height:1.55; max-width:800px; font-weight:500;
  }

  .visual{
    flex:1; display:flex; align-items:center; justify-content:center; gap:56px; position:relative; margin-top:10px;
  }

  .stage-col{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .stage-label{ font-size:15px; font-weight:700; color:var(--muted); letter-spacing:0.02em; }
  .stage-label b{ color:var(--accent); }

  .post-card{
    width:520px; background:var(--bg-card); border:1px solid var(--border);
    border-radius:20px; padding:26px 28px 24px; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.7);
    position:relative;
  }
  .prow{ display:flex; align-items:center; gap:12px; }
  .ava{
    width:44px; height:44px; border-radius:50%; flex:0 0 auto;
  }
  .ava.a2{ background: linear-gradient(135deg, #d9a7c7, #7f9cf5); }
  .pname{ color:var(--fg); font-weight:700; font-size:16.5px; }
  .ptime{ color:var(--muted); font-size:13.5px; margin-left:8px; }
  .ptext{
    color:var(--fg); font-size:18px; line-height:1.6; margin:15px 0 54px;
  }
  .acts{ display:flex; align-items:center; gap:26px; color:var(--icon); position:relative; }
  .a{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--icon); }
  .a svg{ width:21px; height:21px; display:block; }
  .link-btn{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--icon); position:relative; margin-left:2px;
  }
  .link-btn svg{ width:20px; height:20px; }

  /* hover state */
  .hover .link-btn{ background: rgb(30,30,30); }
  .tooltip{
    position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 10px);
    background:#1c1c1c; color:#fff; font-size:13px; font-weight:600; white-space:nowrap;
    padding:7px 13px; border-radius:7px; box-shadow:0 12px 24px -10px rgba(0,0,0,0.6);
  }
  .tooltip::after{
    content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#1c1c1c;
  }
  .cursor{
    position:absolute; width:26px; height:26px; right:-4px; bottom:-14px; z-index:2;
  }

  /* copied state */
  .copied .link-btn{ color:var(--accent); background: rgba(226,146,94,0.14); }
  .toast{
    position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 10px);
    background: rgb(233,234,238); color:#17181b; font-size:13px; font-weight:700; white-space:nowrap;
    padding:8px 16px; border-radius:999px; box-shadow:0 14px 28px -10px rgba(0,0,0,0.6);
    display:flex; align-items:center; gap:6px;
  }
  .toast svg{ width:14px; height:14px; }

  .arrow-mid{ display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--accent); }
  .arrow-mid svg{ width:44px; height:44px; }
  .arrow-mid span{ font-size:14px; font-weight:700; white-space:nowrap; }

  .brand{
    position:absolute; right:68px; bottom:34px; display:flex; align-items:center; gap:12px;
  }
  .brand .mark{ width:40px; height:40px; display:block; }
  .brand .name{ color:var(--fg); font-size:19px; font-weight:800; letter-spacing:-0.01em; }
  .brand .name small{ display:block; color:var(--muted); font-size:12.5px; font-weight:600; letter-spacing:0.02em; }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="inner">
    <div class="eyebrow"><span class="dot"></span>互動列複製按鈕</div>
    <h1>每篇貼文旁，多一顆<b>複製連結</b></h1>
    <p class="sub">互動列新增鏈節圖示，滑過顯示提示，點一下就複製不含追蹤參數的原始連結。</p>

    <div class="visual">
      <div class="stage-col">
        <div class="stage-label">1　滑到鏈節圖示<b>顯示提示</b></div>
        <div class="post-card">
          <div class="prow">
            <div class="ava a2"></div>
            <div>
              <span class="pname">daily.snapshots</span><span class="ptime">8小時</span>
            </div>
          </div>
          <div class="ptext">今天的夕陽把整條街都染成橘色，忍不住多拍了幾張。</div>
          <div class="acts hover">
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>7.1K</span>
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 8.5 8.5 0 0 1-3.4-.7L3 21l1.8-5.6a8.38 8.38 0 0 1-.7-3.4 8.5 8.5 0 0 1 8.4-8.5 8.38 8.38 0 0 1 8.5 8z"/></svg>14</span>
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.6v-2a4 4 0 0 1 4-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.4v2a4 4 0 0 1-4 4H3"/></svg>768</span>
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></span>
            <span class="link-btn">
              <div class="tooltip">複製原始連結</div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></svg>
              <svg class="cursor" viewBox="0 0 24 24" fill="rgba(255,255,255,0.92)" stroke="#17181b" stroke-width="1.2"><path d="M4 3l6.5 16.5 2.2-6.8 6.8-2.2z"/></svg>
            </span>
          </div>
        </div>
      </div>

      <div class="arrow-mid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        <span>點一下</span>
      </div>

      <div class="stage-col">
        <div class="stage-label">2　點擊後<b>已複製原始連結</b></div>
        <div class="post-card">
          <div class="prow">
            <div class="ava a2"></div>
            <div>
              <span class="pname">daily.snapshots</span><span class="ptime">8小時</span>
            </div>
          </div>
          <div class="ptext">今天的夕陽把整條街都染成橘色，忍不住多拍了幾張。</div>
          <div class="acts copied">
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>7.1K</span>
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 8.5 8.5 0 0 1-3.4-.7L3 21l1.8-5.6a8.38 8.38 0 0 1-.7-3.4 8.5 8.5 0 0 1 8.4-8.5 8.38 8.38 0 0 1 8.5 8z"/></svg>14</span>
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.6v-2a4 4 0 0 1 4-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.4v2a4 4 0 0 1-4 4H3"/></svg>768</span>
            <span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></span>
            <span class="link-btn">
              <div class="toast"><svg viewBox="0 0 24 24" fill="none" stroke="#17181b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>已複製原始連結</div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="brand">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" fill="#e2925e" transform="translate(16,16) scale(1.18) translate(-12,-12.1)"/>
      <g transform="translate(16,15.1) scale(0.55) translate(-12,-12)" stroke="#17181b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
        <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
        <path d="M8 12h8"/>
      </g>
    </svg>
    <div class="name">脆連結清潔工<small>Threads Clean Link</small></div>
  </div>
</div>
</body>
</html>
