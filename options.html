<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Threads Clean Link — 設定與淨化紀錄</title>
<style>
  /* 版型與配色沿用 popup.html 的 CSS 變數習慣;深淺色各自完整調校,
     另支援 data-theme 手動覆蓋(auto/light/dark,存 chrome.storage.sync)。 */
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.1);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.12);
    --accent-contrast: #ffffff;
    --good: #006300;
    --danger: #d03b3b;
    --danger-soft: rgba(208, 59, 59, 0.1);
    --switch-track-off: #d0d3d9;
    --switch-thumb: #ffffff;
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0d0d0d;
      --surface: #1a1a19;
      --ink-1: #ffffff;
      --ink-2: #c3c2b7;
      --ink-3: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.18);
      --accent-contrast: #ffffff;
      --good: #0ca30c;
      --danger: #e66767;
      --danger-soft: rgba(230, 103, 103, 0.14);
      --switch-track-off: #55575c;
      --switch-thumb: #e8e8e8;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.1);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.18);
    --accent-contrast: #ffffff;
    --good: #0ca30c;
    --danger: #e66767;
    --danger-soft: rgba(230, 103, 103, 0.14);
    --switch-track-off: #55575c;
    --switch-thumb: #e8e8e8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--plane);
    color: var(--ink-1);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }
  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    vertical-align: -3px;
  }

  /* ---- 頂欄 ---- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 0 20px;
  }
  .logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-contrast);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .logo .icon { width: 22px; height: 22px; }
  .topbar .titles { min-width: 0; flex: 1; }
  .topbar h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0.1px;
  }
  .topbar .sub {
    font-size: 12px;
    color: var(--ink-3);
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .ghost-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 10px;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    cursor: pointer;
    font: inherit;
  }
  .ghost-btn:hover { color: var(--ink-1); border-color: var(--baseline); }
  .lang-btn { width: auto; padding: 0 10px; font-size: 12px; font-weight: 600; }

  /* ---- 統計磚 ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px 12px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .tile .label {
    font-size: 12px;
    color: var(--ink-2);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tile .label .icon { width: 14px; height: 14px; color: var(--ink-3); }
  .tile .value {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.15;
  }
  .tile .meta {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .tile .delta-up { color: var(--good); font-weight: 600; }

  /* ---- 卡片與雙欄 ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .duo {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  /* 左卡高度跟隨右卡:圖表區吃滿剩餘高度並垂直置中,不留下方空洞。 */
  .chart-card { display: flex; flex-direction: column; }
  .chart-card .chart-wrap { flex: 1; display: flex; align-items: center; }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px 0;
  }
  .card-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 650;
  }
  .card-head .hint { font-size: 12px; color: var(--ink-3); }

  /* ---- 圖表 ---- */
  .chart-wrap { padding: 8px 12px 6px; position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .bar { fill: var(--accent); }
  .bar.hot { opacity: 0.85; }
  .bar-band { fill: transparent; cursor: pointer; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-text { fill: var(--ink-3); font-size: 10px; }
  .bar-label { fill: var(--ink-2); font-size: 10px; font-weight: 600; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink-1);
    color: var(--plane);
    font-size: 12px;
    border-radius: 8px;
    padding: 4px 9px;
    white-space: nowrap;
    transform: translate(-50%, -110%);
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .tooltip.show { opacity: 1; }

  /* ---- 設定列 ---- */
  .settings-body { padding: 6px 16px 14px; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    cursor: pointer;
    border-bottom: 1px solid var(--grid);
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-row .txt { min-width: 0; }
  .setting-row .name { font-size: 13px; font-weight: 550; }
  .setting-row .desc { font-size: 12px; color: var(--ink-3); }
  .switch {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    width: 34px;
    height: 20px;
    margin: 0;
    flex-shrink: 0;
    border-radius: 999px;
    background: var(--switch-track-off);
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--switch-thumb);
    transition: transform 0.15s ease;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(14px); }

  /* ---- 按鈕 ---- */
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    border-radius: 9px;
    padding: 6px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn .icon { width: 14px; height: 14px; }
  .btn:hover { color: var(--ink-1); border-color: var(--baseline); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .btn-primary:hover { color: var(--accent-contrast); border-color: var(--accent); opacity: 0.9; }
  .btn-danger-solid {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
  }
  .btn-danger-solid:hover { color: #ffffff; border-color: var(--danger); opacity: 0.9; }

  /* ---- ⋯ 選單與篩選下拉 ---- */
  .menu-wrap { position: relative; display: flex; align-items: center; gap: 10px; }
  .menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 5;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 6px;
    min-width: 190px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    background: none;
    border: none;
    font: inherit;
    font-size: 13px;
    color: var(--ink-1);
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  .menu-item .icon { width: 15px; height: 15px; color: var(--ink-3); }
  .menu-item:hover { background: var(--plane); }
  .menu-item.danger, .menu-item.danger .icon { color: var(--danger); }
  .menu-item.danger:hover { background: var(--danger-soft); }
  .menu-sep { border: none; border-top: 1px solid var(--grid); margin: 4px 6px; }
  .chips-menu { padding: 8px; min-width: max-content; }
  .chips { display: flex; gap: 6px; flex-wrap: nowrap; }
  .chip {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .chip.on {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: transparent;
    font-weight: 600;
  }
  /* 篩選生效(非「全部」)時,收合狀態也看得出來。 */
  #filterBtn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  /* ---- 紀錄清單 ---- */
  .history { margin-bottom: 20px; }
  .history-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px 16px 12px;
  }
  .search {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--plane);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 11px;
    color: var(--ink-3);
  }
  .search input {
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    width: 100%;
    padding: 0;
  }
  .page-size { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--ink-3); }
  .ps {
    appearance: none;
    border: none;
    background: none;
    color: var(--ink-3);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .ps:hover { color: var(--ink-1); }
  .ps.on {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .list-foot {
    padding: 10px 16px 14px;
    border-top: 1px solid var(--grid);
    color: var(--ink-3);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .empty {
    padding: 36px 16px;
    text-align: center;
    color: var(--ink-3);
    border-top: 1px solid var(--grid);
  }
  .empty .icon { width: 26px; height: 26px; margin-bottom: 6px; }

  /* ---- 紀錄卡片牆(0.5.0 方案甲:歷史即收藏，清單升級成卡片)----
     版面/字級數值與使用者手機版 history-card.tsx + constants/theme.ts
     逐項核對(PM 審查後定案):card gap = Spacing.one(4)、padding =
     Spacing.three(16)、borderRadius = PanelRadius(12)。邊框顏色沿用本頁
     既有 --border token(與其餘卡片一致)，不搬手機版调色盤——兩邊配色
     系統本來就不同(手機 accent 是暖橘 #c96f3e，本頁是藍 #2a78d6)。 */
  .icon-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-3);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

  /* 使用者拍板:一排固定兩欄(原本是 auto-fill 依寬度長到三欄)。窄螢幕
     降欄沿用既有斷點系統，見檔尾 @media(max-width:720px)與 .duo 同一個
     斷點收成一欄。 */
  .entry-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 12px 16px 16px;
  }
  .entry-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 124px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    min-width: 0;
    cursor: pointer;
  }
  .entry-card:hover { border-color: var(--baseline); }
  .entry-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .entry-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  /* 卡頭徽章:比照手機版平台徽章的尺寸與樣式(pill 觀感，但實際圓角值取
     PanelRadius=12，不是全圓角 999——以手機版代碼數值為準)。淨化紀錄
     沒有「未知來源」情境，KINDS 一定有標籤，徽章恆常顯示，不像手機版
     platform badge 會有 null 隱藏的狀況。 */
  .entry-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 11px;
    line-height: 14px;
    font-weight: 500;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .entry-time {
    font-size: 14px;
    line-height: 20px;
    font-weight: 500;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .entry-author-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
    min-width: 0;
  }
  .entry-author-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .entry-handle {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .entry-excerpt {
    font-size: 13.5px;
    line-height: 1.48;
    font-weight: 500;
    color: var(--ink-1);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .entry-url {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ink-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-url b { color: var(--accent); font-weight: 600; }
  /* 卡片右上常駐的 ⋮ 選單(取代舊版 hover 浮動三鈕):設定/紀錄頁常開，
     持續可見比 hover 才浮現更利於發現，選單項複製/開啟/刪除沿用既有
     .menu/.menu-item 元件樣式，不另刻一套。 */
  .entry-kebab-wrap {
    position: absolute;
    top: 8px;
    right: 8px;
  }
  .entry-kebab-wrap .icon-btn { width: 28px; height: 28px; }
  .entry-kebab-wrap .menu { min-width: 168px; }

  /* ---- 卡片詳細視窗(0.5.0)兩個權威來源逐項對齊:
     - 結構/行為:手機版 history-detail-dialog.tsx + dialog-shell.tsx
     - 間距/字級/圓角/按鈕樣式:LeafPage 定案 demo(mlc-card-ogp-demo)的
       實際 CSS(.dialog/.sheet-head/.kv/.linkrow/.copy-btn/.btn)，直接照抄
       token 數值，不是憑印象重畫。 ---- */
  .modal-detail {
    position: relative;
    max-width: 420px;
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* ✕ 關閉鈕，對齊 dialog-shell.tsx 的 DialogCloseButton(top:10,right:10,
     28x28,radius:8);取代上一輪自製的底部「關閉」按鈕——兩個權威來源都
     只有右上 ✕ + 點遮罩兩種關法，沒有底部關閉鈕這個設計。 */
  .detail-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-3);
    font-size: 15px;
    line-height: 18px;
    display: grid;
    place-items: center;
    cursor: pointer;
    z-index: 1;
  }
  .detail-close:hover { background: var(--accent-soft); color: var(--accent); }
  /* sheet-head:demo 的 gap:7px 是字面值，不是 spacing token 的倍數。 */
  .detail-head {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--grid);
  }
  /* 作者列:demo 的 .author/.handle 數值(650/12.5px)與卡片牆現行的
     .entry-author-name/.entry-handle(600/14px)不同——卡片牆這輪不在
     範圍內，故另立一組 detail 專屬 class，不動卡片牆既有樣式。 */
  .detail-author-row { display: flex; align-items: baseline; min-width: 0; }
  .detail-author-name {
    font-size: 14px;
    font-weight: 650;
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .detail-handle {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--ink-3);
    margin-left: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .detail-excerpt {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-line-clamp: 15;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
  }
  .detail-excerpt.expanded { -webkit-line-clamp: unset; }
  .link-btn {
    align-self: flex-start;
    appearance: none;
    border: none;
    background: none;
    padding: 2px 0;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; }
  /* kv:demo 的 .kv 是「標籤在上、數值在下」堆疊排版(flex-direction:
     column)，不是左右並排——照代碼實作，不是照轉述的「左標籤右數值」。
     區塊間距靠 .modal-detail 的 gap:12px，不另加每列自己的邊框/留白。 */
  .detail-kv { display: flex; flex-direction: column; gap: 3px; }
  .detail-key { font-size: 11px; letter-spacing: 0.05em; color: var(--ink-3); }
  .detail-value { font-size: 13.5px; line-height: 1.5; color: var(--ink-1); word-break: break-all; }
  /* linkrow:數值+複製鈕同一列，對齊 demo 的 .linkrow;.ellipsis 讓長網址
     單行截斷，不擠壓複製鈕。 */
  .detail-linkrow { display: flex; align-items: center; gap: 8px; }
  .detail-linkrow .detail-value { flex: 1; }
  .ellipsis {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: normal !important;
  }
  .copy-btn {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-3);
    font: inherit;
    font-size: 11.5px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .copy-btn:hover { background: var(--plane); color: var(--ink-1); }
  .detail-timeline { display: flex; flex-direction: column; gap: 6px; }
  .detail-timeline-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--ink-1);
  }
  .detail-timeline-row .k { font-size: 12px; color: var(--ink-3); }
  /* 底部動作列:對齊 dialog-shell.tsx 的 DialogActions/DialogButton——
     等寬(flex:1)、outline 邊框、destructive 只變文字色不是實心底色，
     圓角/padding/字級取自 demo 的 .sheet-actions/.btn。 */
  .dialog-actions { display: flex; gap: 8px; }
  .dialog-btn {
    flex: 1;
    text-align: center;
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    font-size: 13px;
    padding: 9px 0;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .dialog-btn:hover { background: var(--plane); }
  .dialog-btn.destructive { color: var(--danger); }

  footer.about {
    color: var(--ink-3);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding-top: 4px;
  }
  footer.about a {
    color: inherit;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  footer.about a:hover { color: var(--ink-1); }

  /* ---- 對話框 ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    padding: 18px;
  }
  .modal h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 650;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal .desc { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
  .modal textarea {
    width: 100%;
    height: 180px;
    resize: vertical;
    background: var(--plane);
    color: var(--ink-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    outline: none;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .modal-sm { max-width: 380px; }
  .modal-sm .desc { margin-bottom: 4px; }
  .danger-ink { color: var(--danger); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--ink-1);
    color: var(--plane);
    font-size: 13px;
    border-radius: 10px;
    padding: 9px 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .duo { grid-template-columns: 1fr; }
    .entry-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 460px) {
    .page { padding: 16px 12px 40px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="logo"><svg class="icon"><use href="#i-sparkles"/></svg></div>
    <div class="titles">
      <h1>Threads Clean Link</h1>
      <div class="sub"><span data-i18n="opSub">脆連結清潔工 · 設定與紀錄</span> · <span id="version"></span></div>
    </div>
    <div class="topbar-actions">
      <button class="ghost-btn lang-btn" id="langBtn" data-i18n-title="opLangTitle" title="語言 / Language">中文</button>
      <button class="ghost-btn" id="themeBtn" data-i18n-title="opThemeTitle" title="切換主題">
        <svg class="icon"><use id="themeIcon" href="#i-monitor"/></svg>
      </button>
    </div>
  </header>

  <!-- 統計磚:數值由 options.js 從紀錄本地聚合,不另存統計資料。 -->

    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-sparkles"/></svg><span data-i18n="opTileTotal">累計紀錄</span></div>
      <div class="value" id="statTotal">0</div>
      <div class="meta" id="statTotalMeta"></div>
    </div>
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-calendar"/></svg><span data-i18n="opTileWeek">本週</span></div>
      <div class="value" id="statWeek">0</div>
      <div class="meta" id="statWeekMeta"></div>
    </div>
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-link"/></svg><span data-i18n="opTileShare">短碼解析</span></div>
      <div class="value" id="statShare">0</div>
      <div class="meta" id="statShareMeta"></div>
    </div>
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-scissors"/></svg><span data-i18n="opTileStrip">剪除追蹤參數</span></div>
      <div class="value" id="statStrip">0</div>
      <div class="meta" id="statStripMeta"></div>
    </div>
    <!-- 貼文互動列複製 icon(post-icon.js)的統計磚:標籤直接沿用篩選 chip
         已有的 opKindIcon key(「貼文按鈕」),不另造新 key。 -->
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="opKindIcon">貼文按鈕</span></div>
      <div class="value" id="statIcon">0</div>
      <div class="meta" id="statIconMeta"></div>
    </div>
  </section>

  <!-- 圖表 + 設定 -->
  <section class="duo">
    <div class="card chart-card">
      <div class="card-head">
        <h2 data-i18n="opChartTitle">近 14 天活動</h2>
        <span class="hint" data-i18n="opChartUnit">單位:次</span>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <svg id="chart" viewBox="0 0 560 230" role="img" aria-labelledby="chartDesc"></svg>
        <div class="tooltip" id="chartTip"></div>
        <span id="chartDesc" class="sr-only" data-i18n="opChartDesc">近 14 天每日活動次數</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2 data-i18n="opSettingsTitle">設定</h2></div>
      <div class="settings-body">
        <label class="setting-row" for="autoClean">
          <span class="txt">
            <span class="name" data-i18n="opAutoCleanName">自動淨化分享按鈕</span>
            <div class="desc" data-i18n="opAutoCleanDesc">攔截官方「複製連結」，解析短碼、剪除追蹤參數</div>
          </span>
          <input type="checkbox" id="autoClean" class="switch" />
        </label>
        <!-- 0.5.0 方案甲:與 popup 的 postCopyEnabled 鏡像，設定頁保留完整
             開關說明(popup 只留精簡標籤)。 -->
        <label class="setting-row" for="postCopyEnabled">
          <span class="txt">
            <span class="name" data-i18n="opPostCopyName">貼文複製按鈕</span>
            <div class="desc" data-i18n="opPostCopyDesc">在貼文互動列顯示複製連結按鈕</div>
          </span>
          <input type="checkbox" id="postCopyEnabled" class="switch" />
        </label>
        <label class="setting-row" for="saveHistory">
          <span class="txt">
            <span class="name" data-i18n="opSaveName">保存紀錄</span>
            <div class="desc" data-i18n="opSaveDesc">僅存於本機</div>
          </span>
          <input type="checkbox" id="saveHistory" class="switch" />
        </label>
      </div>
    </div>
  </section>

  <!-- 淨化紀錄:0.5.0 方案甲(歷史即收藏)後，清單升級成卡片牆，獨立收藏

  <section class="card history">
    <div class="card-head">
      <h2 data-i18n="opHistoryTitle">紀錄</h2>
      <div class="menu-wrap">
        <span class="page-size" id="pageSizeSel"><span data-i18n="opPerPageA">每頁</span>
          <button class="ps on" data-n="20">20</button>
          <button class="ps" data-n="50">50</button>
          <button class="ps" data-n="100">100</button>
        <span data-i18n="opPerPageB">筆</span></span>
        <button class="ghost-btn" id="moreBtn" data-i18n-title="opMoreTitle" title="更多動作" aria-haspopup="menu" aria-expanded="false">
          <svg class="icon"><use href="#i-more"/></svg>
        </button>
        <div class="menu" id="moreMenu" hidden role="menu">
          <button class="menu-item" id="exportBtn" role="menuitem">
            <svg class="icon"><use href="#i-download"/></svg><span data-i18n="opExportJson">匯出 JSON</span>
          </button>
          <button class="menu-item" id="importBtn" role="menuitem">
            <svg class="icon"><use href="#i-upload"/></svg><span data-i18n="opImportJson">匯入 JSON</span>
          </button>
          <hr class="menu-sep" />
          <button class="menu-item danger" id="clearBtn" role="menuitem">
            <svg class="icon"><use href="#i-trash"/></svg><span data-i18n="opClearAll">清除全部紀錄</span>
          </button>
        </div>
      </div>
    </div>
    <div class="history-tools">
      <div class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="search" id="searchInput" data-i18n-ph="opSearchPh" placeholder="搜尋帳號或網址…" />
      </div>
      <div class="menu-wrap">
        <button class="ghost-btn" id="filterBtn" data-i18n-title="opFilterTitle" title="依來源篩選" aria-expanded="false" aria-controls="chipsRow">

            <button class="chip" data-kind="menu" data-i18n="opKindMenu">右鍵還原</button>
            <button class="chip" data-kind="icon" data-i18n="opKindIcon">貼文按鈕</button>

        </div>
      </div>
    </div>
    <div class="entry-grid" id="rows"></div>
    <div class="empty" id="empty" hidden>
      <svg class="icon"><use href="#i-history"/></svg>
      <div data-i18n="opEmpty">沒有符合條件的紀錄</div>
    </div>
    <div class="list-foot">
      <span id="countHint"></span>
      <span data-i18n="opDeviceNote">紀錄僅保存於這台裝置</span>
    </div>
  </section>

  <footer class="about">
    <a href="https://github.com/hunandy14/threads-clean-link" target="_blank" rel="noreferrer noopener">
      <svg class="icon"><use href="#i-github"/></svg>hunandy14/threads-clean-link
    </a>
    <span>MIT License</span>
  </footer>

</div>

<div class="toast" id="toast"></div>

<!-- 匯入對話框(匯出改為直接下載檔案,不經對話框) -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"><svg class="icon"><use href="#i-upload"/></svg><span data-i18n="opImportTitle">匯入紀錄</span></h3>
    <div class="desc" data-i18n="opImportDesc">選擇先前匯出的 .json 檔，或直接貼上內容;與現有紀錄以網址去重合併。</div>
    <textarea id="modalText" spellcheck="false" placeholder='{ "app": "threads-clean-link", "version": 1, "entries": [ … ] }'></textarea>
    <div class="modal-actions">
      <button class="btn" id="modalClose" data-i18n="opClose">關閉</button>
      <button class="btn" id="modalFile">
        <svg class="icon"><use href="#i-upload"/></svg><span data-i18n="opChooseFile">選擇檔案</span>
      </button>
      <button class="btn btn-primary" id="modalPrimary" data-i18n="opDoImport">匯入</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden />
  </div>
</div>

<!-- 清除全部:確認對話框 -->
<div class="overlay" id="confirmOverlay" hidden>
  <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <h3 id="confirmTitle"><svg class="icon danger-ink"><use href="#i-trash"/></svg><span data-i18n="opClearAll">清除全部紀錄</span></h3>
    <div class="desc" id="confirmDesc"></div>
    <div class="modal-actions">
      <button class="btn" id="confirmCancel" data-i18n="opCancel">取消</button>
      <button class="btn btn-danger-solid" id="confirmOk" data-i18n="opClearDo">確定清除</button>
    </div>
  </div>
</div>

<!-- 卡片詳細視窗(0.5.0):兩個權威來源逐項對齊——結構/行為照手機版
     history-detail-dialog.tsx，間距/字級/圓角/按鈕樣式照 LeafPage 定案
     demo(mlc-card-ogp-demo)的實際 CSS。點卡片本身開啟，✕ 鈕或點遮罩或
     Esc 關閉。sr-only 標題供螢幕閱讀器用，視覺上不畫額外標題列，直接從
     卡頭(徽章/時間)開始。original/removedParams 我們沒存，demo 上那兩列
     誠實省略，只留乾淨網址一列。 -->
<div class="overlay" id="detailOverlay" hidden>
  <div class="modal modal-detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <h3 id="detailTitle" class="sr-only" data-i18n="opDetailTitle">紀錄詳細資訊</h3>
    <!-- ✕ 關閉鈕，對齊 dialog-shell.tsx 的 DialogCloseButton;取代前一版
         自製的底部「關閉」按鈕，兩個權威來源都沒有這個設計。 -->
    <button class="detail-close" id="detailClose" data-i18n-title="opClose" title="關閉" aria-label="關閉">✕</button>
    <div class="detail-head">
      <div class="entry-meta">
        <span class="entry-badge" id="detailBadge"></span>
        <span class="entry-time" id="detailTime"></span>
      </div>
      <div class="detail-author-row" id="detailAuthorRow" hidden>
        <span class="detail-author-name" id="detailAuthorName"></span>
        <span class="detail-handle" id="detailHandle"></span>
      </div>
      <!-- 15 行截斷，對齊手機版 EXCERPT_DIALOG_LINES;超長時「展開全文」
           原地移除截斷(手機版是巢狀開第二層 Modal，理由是 RN 在 iOS 不
           支援兄弟層 Modal 並開——web 沒有這個限制，原地展開行為等價、
           實作更簡單)。 -->
      <div class="detail-excerpt" id="detailExcerpt" hidden></div>
      <button class="link-btn" id="detailExpandBtn" hidden data-i18n="opExpandFull">展開全文</button>
      <div id="detailUrlFallback" hidden></div>
    </div>

    <!-- 乾淨網址 kv:標籤在上、數值+複製鈕同一列在下，對齊 demo 的
         .kv/.linkrow 堆疊排版(不是左標籤右數值並排)。 -->
    <div class="detail-kv">
      <span class="detail-key" data-i18n="opUrlLabel">乾淨網址</span>
      <div class="detail-linkrow">
        <span class="detail-value ellipsis" id="detailUrlValue"></span>
        <button class="copy-btn" id="detailUrlCopyBtn" data-i18n="opCopyShort">複製</button>
      </div>
    </div>

    <!-- 記錄時間 kv:seen.length > 1(由另一車道 fix/dedup-merge 補上
         schema)時才出現「時間軸」鈕，防禦寫法見 openEntryDetail/
         buildSeenTimeline。 -->
    <div class="detail-kv">
      <span class="detail-key" data-i18n="opRecordedTime">記錄時間</span>
      <div class="detail-linkrow">
        <span class="detail-value" id="detailRecordedTime"></span>
        <button class="copy-btn" id="detailTimelineBtn" hidden></button>
      </div>
    </div>
    <!-- 時間軸展開區:原地開合(取代手機版的巢狀第二層 Modal，理由同展開
         全文——iOS 平台限制不適用於 web)，新到舊逐筆列「時間 + 來源
         標籤」，來源標籤沿用既有 kind 文案。 -->
    <div class="detail-timeline" id="detailTimeline" hidden></div>

    <!-- 底部動作列:對齊 DialogActions/DialogButton，等寬、outline 邊框，
         destructive 只變文字色(不是實心底色)。 -->
    <div class="dialog-actions">
      <button class="dialog-btn" id="detailCopyBtn" data-i18n="opCopyTitle">複製乾淨網址</button>
      <a class="dialog-btn" id="detailOpenLink" target="_blank" rel="noopener" data-i18n="opOpenTitle">開啟貼文</a>
      <button class="dialog-btn destructive" id="detailDeleteBtn" data-i18n="opDeleteTitle">刪除這筆</button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="options.js"></script>
<script src="options-init.js"></script>
</body>
</html>
