<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Threads Clean Link — 設定與淨化紀錄</title>
<style>
  /* 版型與配色沿用 popup.html 的 CSS 變數習慣;深淺色各自完整調校，
     另支援 data-theme 手動覆蓋(auto/light/dark，存 chrome.storage.sync)。

     【唯一數值權威】所有跟手機版對齊的數值(色票/間距/字級/圓角)一律以
     使用者手機 repo 當下源碼為準(src/constants/theme.ts、
     src/components/history-card.tsx、history-detail-dialog.tsx、
     dialog-shell.tsx)。--accent 用手機 theme.ts 的暖橘(light #c96f3e /
     dark #e2925e)，--card-outline/--card-selected-border 照
     theme.ts 的 cardOutline/cardSelectedBorder 字面值(後者深淺色刻意同
     色，theme.ts 原文有註解說明「橘光在兩種底色上都成立」)。--accent-soft
     手機端沒有對應 token(手機不用半透明底做選中態)，屬本頁衍生值，非
     手機源碼字面值。 */
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.1);
    --accent: #c96f3e;
    --accent-soft: rgba(201, 111, 62, 0.14);
    --accent-contrast: #ffffff;
    --card-outline: rgba(43, 42, 39, 0.18);
    --card-selected-border: #e2925ecc;
    --good: #006300;
    --danger: #d03b3b;
    --danger-soft: rgba(208, 59, 59, 0.1);
    /* 帳號入口(車道 B)的「登入過期」語意色，既有色票沒有這個第三態，
       綠(已同步)/紅(錯誤)之外新增一顆黃供狀態點與選單提示列使用。
       #d9a441 對 --surface(#fcfcfb)只有約 2.19:1 對比，未達 WCAG 非文字
       元素 3:1 門檻(狀態點本身就是純色塊，沒有文字襯托);改用 #b8862b，
       實測約 3.16:1。 */
    --warn: #b8862b;
    /* 選單提示列(.acct-warn-row)的淡底色，比照 --accent-soft/--danger-soft
       同一套「主色 + 淡底變體」慣例，alpha 沿用 --accent-soft 的 0.14。 */
    --warn-soft: rgba(184, 134, 43, 0.14);
    --switch-track-off: #d0d3d9;
    --switch-thumb: #ffffff;
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0d0d0d;
      --surface: #1a1a19;
      --ink-1: #ffffff;
      --ink-2: #c3c2b7;
      --ink-3: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #e2925e;
      --accent-soft: rgba(226, 146, 94, 0.2);
      --accent-contrast: #ffffff;
      --card-outline: rgba(255, 255, 255, 0.15);
      --card-selected-border: #e2925ecc;
      --good: #0ca30c;
      --danger: #e66767;
      --danger-soft: rgba(230, 103, 103, 0.14);
      --warn: #e6b955;
      --warn-soft: rgba(230, 185, 85, 0.2);
      --switch-track-off: #55575c;
      --switch-thumb: #e8e8e8;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.1);
    --accent: #e2925e;
    --accent-soft: rgba(226, 146, 94, 0.2);
    --accent-contrast: #ffffff;
    --card-outline: rgba(255, 255, 255, 0.15);
    --card-selected-border: #e2925ecc;
    --good: #0ca30c;
    --danger: #e66767;
    --danger-soft: rgba(230, 103, 103, 0.14);
    --warn: #e6b955;
    --warn-soft: rgba(230, 185, 85, 0.2);
    --switch-track-off: #55575c;
    --switch-thumb: #e8e8e8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  /* 全域 [hidden] 規則，!important 蓋過同頁面任何元素自己的 display 宣告。
     少這一條，只要某元素自己的 CSS 規則有寫 display(例如
     .detail-author-row{display:flex})，同 specificity 的作者層規則會贏過
     瀏覽器 UA 樣式表的 [hidden]{display:none}(cascade 以 origin 排序，
     author 一律贏 UA)，導致 JS 端設 .hidden=true 完全沒有視覺效果。 */
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--plane);
    color: var(--ink-1);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }
  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    vertical-align: -3px;
  }

  /* ---- 頂欄 ---- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 0 20px;
  }
  /* 品牌盾牌鏈節(#i-brand)是自帶固定雙色的圖形，不再套橘色底 chip——
     否則橘盾疊在橘底上會糊掉。改成透明框，讓盾牌自身的橘色直接對比
     header 底(--plane)，深淺主題都浮得出來。 */
  .logo {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  /* 盾牌在 40px 透明框裡置中，22px 相對標題字重偏小，放大到 28px 取得平衡。 */
  .logo .icon { width: 28px; height: 28px; }
  .topbar .titles { min-width: 0; flex: 1; }
  .topbar h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0.1px;
  }
  .topbar .sub {
    font-size: 12px;
    color: var(--ink-3);
  }
  /* 副標的環境標籤(僅 staging/local 顯示,見 options.js renderEnvBadge):
     跟帳號選單 .acct-warn-row 同一套「主色 + 淡底變體」慣例,深淺主題靠
     既有 --warn/--accent 系列變數自動換色,不寫死色碼。 */
  .env-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    vertical-align: middle;
  }
  .env-badge-staging { background: var(--warn-soft); color: var(--warn); }
  .env-badge-local { background: var(--accent-soft); color: var(--accent); }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .ghost-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 10px;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    cursor: pointer;
    font: inherit;
  }
  .ghost-btn:hover { color: var(--ink-1); border-color: var(--baseline); }
  .lang-btn { width: auto; padding: 0 10px; font-size: 12px; font-weight: 600; }

  /* ---- 統計磚 ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px 12px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .tile .label {
    font-size: 12px;
    color: var(--ink-2);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tile .label .icon { width: 14px; height: 14px; color: var(--ink-3); }
  .tile .value {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.15;
  }
  .tile .meta {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .tile .delta-up { color: var(--good); font-weight: 600; }

  /* ---- 卡片與雙欄 ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .duo {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  /* 左卡高度跟隨右卡:圖表區吃滿剩餘高度並垂直置中，不留下方空洞。 */
  .chart-card { display: flex; flex-direction: column; }
  .chart-card .chart-wrap { flex: 1; display: flex; align-items: center; }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px 0;
  }
  .card-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 650;
  }
  .card-head .hint { font-size: 12px; color: var(--ink-3); }

  /* ---- 圖表 ---- */
  .chart-wrap { padding: 8px 12px 6px; position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .bar { fill: var(--accent); }
  .bar.hot { opacity: 0.85; }
  .bar-band { fill: transparent; cursor: pointer; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-text { fill: var(--ink-3); font-size: 10px; }
  .bar-label { fill: var(--ink-2); font-size: 10px; font-weight: 600; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink-1);
    color: var(--plane);
    font-size: 12px;
    border-radius: 8px;
    padding: 4px 9px;
    white-space: nowrap;
    transform: translate(-50%, -110%);
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .tooltip.show { opacity: 1; }

  /* =========================================================
     頁首帳號入口(車道 B):觸發鈕依 data-state 概念切換未登入/已登入/
     同步中/錯誤/登入過期，DOM 結構與動效沿用核准 demo
     (account-header-demo.html)，見 options.js 的 renderAccount。
     ========================================================= */
  .account-area { position: relative; }
  .signin-btn .g-icon { width: 16px; height: 16px; }

  .account-trigger {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 3px; padding-right: 10px; display: inline-flex; align-items: center;
    gap: 8px; cursor: pointer; font: inherit;
  }
  /* hover 只用 filter 微調底色亮度，不放大(不加 transform:scale)。 */
  .account-trigger:hover { border-color: var(--baseline); filter: brightness(1.08); }
  .account-trigger[aria-expanded="true"] { border-color: var(--accent); }
  .avatar-wrap { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
  .avatar-circle {
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
    display: grid; place-items: center; font-size: 13px; font-weight: 700; user-select: none;
    overflow: hidden;
  }
  /* 有大頭照時底色透明:img 本來就 100%/100% + overflow:hidden 蓋滿整個
     圓框，--accent 背景平時被完全遮住看不見，但 img 載入失敗會先
     onerror 才退回字母(見 options.js 的 renderAvatars)，這段時間縫隙裡
     露出的應該是透明，不是誤導使用者「這裡本來有色塊」的實色。 */
  .avatar-circle.has-photo { background: transparent; }
  /* 下拉選單頂部帳號列用的 40px 大頭像變體，只覆寫尺寸，其餘沿用
     .avatar-circle。 */
  .avatar-circle.acct-menu-avatar { width: 40px; height: 40px; flex-shrink: 0; }
  /* 同步中:外圈疊在頭像外緣的 2px 弧線。預設(含 prefers-reduced-motion:
     reduce)只畫靜態淡色圓環;轉動效果收進下面的 no-preference 媒體查詢，
     一併帶出頂色對比，reduce 時保留「正在同步」的視覺提示但不轉動。 */
  .avatar-wrap.is-syncing::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--accent-soft);
  }
  @media (prefers-reduced-motion: no-preference) {
    .avatar-wrap.is-syncing::after {
      border-top-color: var(--accent);
      animation: acct-spin 0.85s linear infinite;
    }
  }
  @keyframes acct-spin { to { transform: rotate(360deg); } }
  .status-dot {
    position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%;
    border: 2px solid var(--surface); background: var(--good);
  }
  .status-dot.is-danger { background: var(--danger); }
  .status-dot.is-warning { background: var(--warn); }
  .acc-name { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  @media (max-width: 720px) {
    .acc-name { display: none; }
    .account-trigger { padding-right: 3px; gap: 0; }
  }
  /* 頭像大頭照(avatarUrl):img 與字母備援互斥顯示，見 options.js 的
     renderAvatars。 */
  .avatar-photo { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* 帳號下拉選單:寬 280px，右對齊頁首，其餘沿用 .menu 圓角/陰影。開合
     動效:淡入 + 從 0.96 縮放到 1，transform-origin 右上，約 120ms;尊重
     prefers-reduced-motion，該設定開啟時不套用 transition，瞬間切換。
     顯示/隱藏仍靠 [hidden] 屬性做無障礙層級的開關，動畫只發生在 [hidden]
     被移除之後、加上 .is-open 之前那一小段時間窗(見 openAcctMenu/
     closeAcctMenu)。 */
  .acct-menu {
    width: 280px; min-width: 280px; padding: 10px;
    transform-origin: top right;
    opacity: 0;
    transform: scale(0.96);
  }
  .acct-menu.is-open { opacity: 1; transform: scale(1); }
  @media (prefers-reduced-motion: no-preference) {
    .acct-menu { transition: opacity 0.12s ease, transform 0.12s ease; }
  }
  /* 選單頂部的帳號列:頭像 + 名字/email 兩行，純展示、不可點。 */
  .acct-menu-header { display: flex; align-items: center; gap: 10px; padding: 2px 4px 10px; cursor: default; }
  .acct-menu-header-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .acct-menu-header-text .acct-menu-name,
  .acct-menu-header-text .acct-menu-email {
    padding: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .acct-menu-name { font-size: 13px; font-weight: 650; color: var(--ink-1); padding: 2px 4px 0; }
  .acct-menu-email { font-size: 12px; color: var(--ink-3); word-break: break-all; padding: 0 4px 8px; }
  .acct-menu-sub { font-size: 12px; color: var(--ink-3); padding: 0 4px 8px; }
  .acct-menu .menu-sep { margin: 6px 4px; }
  .acct-error-row, .acct-warn-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border-radius: 8px; padding: 7px 9px; margin: 0 0 8px; font-size: 12px; font-weight: 600;
  }
  .acct-error-row { background: var(--danger-soft); color: var(--danger); }
  .acct-error-row .link-btn { color: var(--danger); font-size: 12px; flex-shrink: 0; }
  /* 語意色改用 --warn(登入過期是黃色第三態，跟 --accent 純屬巧合撞色，
     不是同一件事——狀態點/這一列都該用同一顆 --warn 變數)。 */
  .acct-warn-row { background: var(--warn-soft); color: var(--warn); }
  .acct-warn-row .link-btn { color: var(--warn); font-size: 12px; flex-shrink: 0; }
  .acct-error-row .link-btn:hover, .acct-warn-row .link-btn:hover { text-decoration: underline; }

  /* ---- 設定列 ---- */
  .settings-body { padding: 6px 16px 14px; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    cursor: pointer;
    border-bottom: 1px solid var(--grid);
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-row .txt { min-width: 0; }
  .setting-row .name { font-size: 13px; font-weight: 550; }
  .setting-row .desc { font-size: 12px; color: var(--ink-3); }
  .switch {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    width: 34px;
    height: 20px;
    margin: 0;
    flex-shrink: 0;
    border-radius: 999px;
    background: var(--switch-track-off);
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--switch-thumb);
    transition: transform 0.15s ease;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(14px); }

  /* ---- 按鈕 ---- */
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    border-radius: 9px;
    padding: 6px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn .icon { width: 14px; height: 14px; }
  .btn:hover { color: var(--ink-1); border-color: var(--baseline); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .btn-primary:hover { color: var(--accent-contrast); border-color: var(--accent); opacity: 0.9; }
  .btn-danger-solid {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
  }
  .btn-danger-solid:hover { color: #ffffff; border-color: var(--danger); opacity: 0.9; }

  /* ---- ⋯ 選單與篩選下拉 ---- */
  .menu-wrap { position: relative; display: flex; align-items: center; gap: 10px; }
  .menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 5;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 6px;
    min-width: 190px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    background: none;
    border: none;
    font: inherit;
    font-size: 13px;
    color: var(--ink-1);
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  .menu-item .icon { width: 15px; height: 15px; color: var(--ink-3); }
  .menu-item:hover { background: var(--plane); }
  .menu-item.danger, .menu-item.danger .icon { color: var(--danger); }
  .menu-item.danger:hover { background: var(--danger-soft); }
  /* 停用態(如同步中的 acctSyncNowBtn):維持不可點的視覺訊號，hover 不
     換底色，免得看起來還能點。 */
  .menu-item:disabled { opacity: 0.5; cursor: not-allowed; }
  .menu-item:disabled:hover { background: none; }
  .menu-sep { border: none; border-top: 1px solid var(--grid); margin: 4px 6px; }
  .chips-menu { padding: 8px; min-width: max-content; }
  .chips { display: flex; gap: 6px; flex-wrap: nowrap; }
  .chip {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .chip.on {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: transparent;
    font-weight: 600;
  }
  /* 篩選生效(非「全部」)時，收合狀態也看得出來。 */
  #filterBtn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  /* ---- 紀錄清單 ---- */
  .history { margin-bottom: 20px; }
  .history-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px 16px 12px;
  }
  .search {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--plane);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 11px;
    color: var(--ink-3);
  }
  .search input {
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    width: 100%;
    padding: 0;
  }
  .page-size { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--ink-3); }
  .ps {
    appearance: none;
    border: none;
    background: none;
    color: var(--ink-3);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .ps:hover { color: var(--ink-1); }
  .ps.on {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .list-foot {
    padding: 10px 16px 14px;
    border-top: 1px solid var(--grid);
    color: var(--ink-3);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .empty {
    padding: 36px 16px;
    text-align: center;
    color: var(--ink-3);
    border-top: 1px solid var(--grid);
  }
  .empty .icon { width: 26px; height: 26px; margin-bottom: 6px; }

  /* ---- 紀錄卡片牆(唯一數值權威見上方 :root 註解) ----
     版面/字級數值與手機版 history-card.tsx + constants/theme.ts 逐項核對:
     card gap = Spacing.one(4)、padding = Spacing.three(16)、borderRadius =
     PanelRadius(12)。卡片為「純外框線」風格:背景 transparent、邊框色
     --card-outline，不填 --surface 底色。

     互動模型照手機版「選中態」:手機沒有 web 的常駐 ⋮ 選單，是
     hover/press 時邊框轉主色、寬度 1→1.5，右上浮出兩顆快捷 icon
     (複製/開啟，對應手機 Copy/Share2)；web 用 :hover 與 :focus-within
     模擬(:focus-within 讓鍵盤 Tab 到卡片上也能觸發同一套高亮視覺)。刪除
     動作只在詳細視窗做，照手機版 DialogActions 的位置。 */

  /* 一排固定兩欄。窄螢幕降欄沿用既有斷點系統，見檔尾
     @media(max-width:720px)與 .duo 同一個斷點收成一欄。 */
  .entry-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 12px 16px 16px;
  }
  .entry-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 124px;
    padding: 16px;
    border: 1px solid var(--card-outline);
    border-radius: 12px;
    background: transparent;
    min-width: 0;
    cursor: pointer;
  }
  .entry-card:hover,
  .entry-card:focus-within {
    border-color: var(--card-selected-border);
    border-width: 1.5px;
    outline: none;
  }
  /* 高亮態右上浮出的兩顆快捷鈕(複製連結/開啟貼文)，平時態不佔版面
     (display:none，不是 opacity/visibility——不高亮時完全不吃 hit-test，
     也不會被 Tab 意外聚焦到)。 */
  .entry-quick {
    position: absolute;
    top: 8px;
    right: 8px;
    display: none;
    gap: 4px;
  }
  .entry-card:hover .entry-quick,
  .entry-card:focus-within .entry-quick {
    display: flex;
  }
  .entry-quick-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-3);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    cursor: pointer;
    text-decoration: none;
  }
  .entry-quick-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .entry-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .entry-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  /* 卡頭徽章:比照手機版平台徽章的尺寸與樣式(pill 觀感，但實際圓角值取
     PanelRadius=12，不是全圓角 999——以手機版代碼數值為準)。淨化紀錄
     沒有「未知來源」情境，KINDS 一定有標籤，徽章恆常顯示，不像手機版
     platform badge 會有 null 隱藏的狀況。 */
  .entry-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 11px;
    line-height: 14px;
    font-weight: 500;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .entry-time {
    font-size: 14px;
    line-height: 20px;
    font-weight: 500;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .entry-author-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
    min-width: 0;
  }
  .entry-author-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .entry-handle {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .entry-excerpt {
    font-size: 13.5px;
    line-height: 1.48;
    font-weight: 500;
    color: var(--ink-1);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .entry-url {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ink-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-url b { color: var(--accent); font-weight: 600; }

  /* ---- 卡片詳細視窗(唯一數值權威見上方 :root 註解):結構/行為與間距/
     字級/圓角/按鈕樣式一律照手機版 history-detail-dialog.tsx +
     dialog-shell.tsx 的字面 token 值。 ---- */
  .modal-detail {
    position: relative;
    max-width: 420px;
    border-radius: 12px;
    border-color: var(--card-outline);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* ✕ 關閉鈕，對齊 dialog-shell.tsx 的 DialogCloseButton(top:10,right:10,
     28x28,radius:8)。 */
  .detail-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-3);
    font-size: 15px;
    line-height: 18px;
    display: grid;
    place-items: center;
    cursor: pointer;
    z-index: 1;
  }
  .detail-close:hover { background: var(--accent-soft); color: var(--accent); }
  /* head:gap = Spacing.one(4)、paddingBottom = Spacing.two(8)。 */
  .detail-head {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--grid);
  }
  /* 作者列:16px/600(ThemedText type="default" 基底 16px + fontWeight:600
     覆寫)、handle 14px/500(ThemedText type="small" 的基底值，色套
     textSecondary)。與卡片牆的 .entry-author-name/.entry-handle
     (14px/600、14px/500)數值不同——卡片牆不在這條 kv 的權威來源範圍內
     (卡片有卡片自己的字級規格)，兩邊各自忠於各自的來源，不強行同步，
     故仍另立一組 detail 專屬 class。 */
  .detail-author-row { display: flex; align-items: baseline; min-width: 0; }
  .detail-author-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .detail-handle {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
    margin-left: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .detail-excerpt .excerpt-link {
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .detail-excerpt .excerpt-link:hover {
    text-decoration: underline;
  }
  .detail-excerpt {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-1);
    display: -webkit-box;
    -webkit-line-clamp: 15;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
  }
  .detail-excerpt.expanded { -webkit-line-clamp: unset; }
  /* 展開全文:主色 + 靠左展開圖示(Lucide 風;手機版用「⤢」字元，web 改用
     現有 SVG symbol 語彙保持整頁圖示系統一致，同一個視覺意圖)。 */
  .link-btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    appearance: none;
    border: none;
    background: none;
    padding: 2px 0;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; }
  .link-btn .icon { width: 13px; height: 13px; }
  /* kv:標籤在上、數值在下的堆疊排版(照手機版 CopyRow 的 styles.kv)。 */
  .detail-kv { display: flex; flex-direction: column; gap: 3px; }
  .detail-key { font-size: 11px; letter-spacing: 0.05em; color: var(--ink-3); }
  .detail-value { font-size: 13.5px; line-height: 1.5; color: var(--ink-1); word-break: break-all; }
  /* 淨化後連結是唯一「accent 強調」的一列(CopyRow 呼叫時帶 accent
     prop)，原始連結/追蹤參數兩列沒有這個修飾。 */
  #detailUrlValue { color: var(--accent); }
  .detail-linkrow { display: flex; align-items: center; gap: 8px; }
  .detail-linkrow .detail-value { flex: 1; }
  .ellipsis {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: normal !important;
  }
  .copy-btn {
    appearance: none;
    border: 1px solid var(--card-outline);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-3);
    font: inherit;
    font-size: 11.5px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .copy-btn:hover { background: var(--plane); color: var(--ink-1); }
  /* 時間軸子層視窗(疊在詳細視窗上，照手機版巢狀 Modal)內的逐列軌道+
     圓點:最新一筆實心主色圓點，其餘空心主色圓圈，點與點之間垂直細線
     相連——字面值照手機版 timelineDot/timelineLine(寬高10、
     borderWidth1.5、線寬1.5)。 */
  .timeline-row { display: flex; gap: 12px; }
  .timeline-rail { width: 10px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .timeline-dot {
    width: 10px;
    height: 10px;
    border-radius: 5px;
    border: 1.5px solid var(--accent);
    margin-top: 5px;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  .timeline-dot.filled { background: var(--accent); }
  .timeline-line {
    flex: 1;
    width: 1.5px;
    margin-top: 2px;
    margin-bottom: -3px;
    background: var(--card-outline);
  }
  .timeline-text {
    font-size: 13.5px;
    line-height: 20px;
    padding-bottom: 10px;
    color: var(--ink-1);
  }
  .timeline-text.secondary { color: var(--ink-3); }
  .timeline-kind { color: var(--ink-3); }
  /* 底部動作列:對齊 dialog-shell.tsx 的 DialogActions/DialogButton——
     等寬(flex:1)、outline 邊框、圓角 PanelRadius(12)，destructive 只變
     文字色不是實心底色。 */
  .dialog-actions { display: flex; gap: 8px; }
  .dialog-btn {
    flex: 1;
    text-align: center;
    appearance: none;
    border: 1px solid var(--card-outline);
    border-radius: 12px;
    background: transparent;
    color: var(--ink-1);
    font: inherit;
    font-size: 13px;
    padding: 9px 0;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .dialog-btn:hover { background: var(--plane); }
  .dialog-btn.destructive { color: var(--danger); }

  footer.about {
    color: var(--ink-3);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding-top: 4px;
  }
  footer.about a {
    color: inherit;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  footer.about a:hover { color: var(--ink-1); }

  /* ---- 對話框 ----
     遮罩透明度 0.55，照手機版 dialog-shell.tsx 的單一共用 DialogShell
     (全 app 唯一的 dialog 外殼，三個對話框——匯入/清除確認/詳細視窗
     一致採用，不是只套用在詳細視窗)。 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 10;
  }
  /* .overlay[hidden] 這條窄規則已被上面全域的 [hidden]{display:none
     !important} 收斂取代，不再需要逐一補。 */
  /* 時間軸子層視窗疊在詳細視窗之上(照手機版巢狀 Modal 的做法)，z-index
     取高一階，DOM 順序本身其實已經夠(接在 detailOverlay 後面)，這裡明寫
     出來避免日後調順序時踩到。 */
  #timelineOverlay { z-index: 11; }
  /* 確認框可疊在詳細視窗之上(詳細視窗的「刪除這筆」會開這個框)，z-index
     再高一階。少了這條就會撞上 DOM 順序:#confirmOverlay 寫在
     #detailOverlay 前面，同為 z-index:10 時後者贏，確認框整個被遮住——
     畫面看似沒反應、焦點靜默落在看不見的取消鈕、點遮罩還關錯視窗。 */
  #confirmOverlay { z-index: 12; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    padding: 18px;
  }
  .modal h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 650;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal .desc { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
  .modal textarea {
    width: 100%;
    height: 180px;
    resize: vertical;
    background: var(--plane);
    color: var(--ink-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    outline: none;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .modal-sm { max-width: 380px; }
  .modal-sm .desc { margin-bottom: 4px; }
  .danger-ink { color: var(--danger); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--ink-1);
    color: var(--plane);
    font-size: 13px;
    border-radius: 10px;
    padding: 9px 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .duo { grid-template-columns: 1fr; }
    .entry-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 460px) {
    .page { padding: 16px 12px 40px; }
  }
</style>
</head>

<div class="page">

  <header class="topbar">
    <div class="logo"><svg class="icon"><use href="#i-brand"/></svg></div>
    <div class="titles">
      <h1>Threads Clean Link</h1>
      <div class="sub"><span data-i18n="opSub">脆連結清潔工 · 設定與紀錄</span> · <span id="version"></span><span id="envBadge" class="env-badge" hidden></span></div>
    </div>
    <div class="topbar-actions">
      <button class="ghost-btn lang-btn" id="langBtn" data-i18n-title="opLangTitle" title="語言 / Language">中文</button>
      <button class="ghost-btn" id="themeBtn" data-i18n-title="opThemeTitle" title="切換主題">
        <svg class="icon"><use id="themeIcon" href="#i-monitor"/></svg>
      </button>

      <!-- 帳號入口(車道 B):唯一觸發鈕依 syncState 切換未登入/已登入/
           同步中/錯誤/登入過期五種外觀，見 options.js 的 renderAccount。
           取代原本頁面中段的雲端同步卡片。 -->
      <div class="account-area" id="acctArea">
        <!-- 未登入:低調外框鈕 + Google G 圖示。點擊走既有登入確認框
             (複用 #confirmOverlay)→ ensureSyncPermissions → sync.signIn。 -->
        <button class="btn signin-btn" id="acctSignInBtn" data-i18n-aria="opAccountSignIn" aria-label="登入">
          <svg class="g-icon" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.68 9c0-.593.102-1.17.284-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
          </svg>
          <span id="acctSignInLabel" data-i18n="opAccountSignIn">登入</span>
        </button>

        <!-- 已登入/同步中/錯誤/登入過期:頭像觸發鈕 + 下拉選單，同一份
             DOM，內容依狀態切換顯隱(renderAccount)。 -->
        <button class="account-trigger" id="acctTrigger" hidden aria-haspopup="menu" aria-expanded="false" data-i18n-aria="opAccountMenuLabel" aria-label="帳號選單">
          <span class="avatar-wrap" id="avatarWrap">
            <span class="avatar-circle" id="avatarCircle">
              <span id="avatarLetter"></span>
              <img class="avatar-photo" id="avatarPhoto" alt="" referrerpolicy="no-referrer" hidden />
            </span>
            <span class="status-dot" id="statusDot" hidden></span>
          </span>
          <span class="acc-name" id="acctHeaderName"></span>
        </button>

        <div class="menu acct-menu" id="acctMenu" hidden role="menu">
          <!-- 錯誤態:紅字錯誤訊息 + 重試(直接重試同步 sync.now，不需重新授權)。 -->
          <div class="acct-error-row" id="acctErrorRow" hidden>
            <span id="acctErrorText"></span>
            <button class="link-btn" id="acctRetryBtn" data-i18n="opAccountRetry">重試</button>
          </div>
          <!-- 登入過期態:黃字提示 + 重新登入(走完整登入確認框流程)。 -->
          <div class="acct-warn-row" id="acctExpiredRow" hidden>
            <span id="acctExpiredText" data-i18n="opAccountExpired">登入已過期，請重新登入</span>
            <button class="link-btn" id="acctReSignInBtn" data-i18n="opAccountReSignIn">重新登入</button>
          </div>

          <div class="acct-menu-header">
            <span class="avatar-circle acct-menu-avatar" id="acctMenuAvatarCircle" aria-hidden="true">
              <span id="acctMenuAvatarLetter"></span>
              <img class="avatar-photo" id="acctMenuAvatarPhoto" alt="" referrerpolicy="no-referrer" hidden />
            </span>
            <span class="acct-menu-header-text">
              <span class="acct-menu-name" id="acctMenuName"></span>
              <span class="acct-menu-email" id="acctMenuEmail"></span>
            </span>
          </div>
          <div class="acct-menu-sub" id="acctMenuSub"></div>
          <hr class="menu-sep" />
          <button class="menu-item" id="acctSyncNowBtn" role="menuitem">
            <svg class="icon"><use href="#i-refresh"/></svg>
            <span id="acctSyncLabel" data-i18n="opAccountSyncNow">立即同步</span>
          </button>
          <button class="menu-item" id="acctSignOutBtn" role="menuitem">
            <svg class="icon"><use href="#i-logout"/></svg><span data-i18n="opAccountSignOut">登出</span>
          </button>
          <hr class="menu-sep" />
          <button class="menu-item danger" id="acctDeleteBtn" role="menuitem">
            <svg class="icon"><use href="#i-trash"/></svg><span data-i18n="opAccountDeleteCloud">刪除雲端資料</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 統計磚:數值由 options.js 從紀錄本地聚合，不另存統計資料。 -->
  <section class="stats" data-i18n-aria="opStatsAria" aria-label="統計摘要">
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-sparkles"/></svg><span data-i18n="opTileTotal">累計紀錄</span></div>
      <div class="value" id="statTotal">0</div>
      <div class="meta" id="statTotalMeta"></div>
    </div>
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-calendar"/></svg><span data-i18n="opTileWeek">本週</span></div>
      <div class="value" id="statWeek">0</div>
      <div class="meta" id="statWeekMeta"></div>
    </div>
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-link"/></svg><span data-i18n="opTileShare">短碼解析</span></div>
      <div class="value" id="statShare">0</div>
      <div class="meta" id="statShareMeta"></div>
    </div>
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-scissors"/></svg><span data-i18n="opTileStrip">剪除追蹤參數</span></div>
      <div class="value" id="statStrip">0</div>
      <div class="meta" id="statStripMeta"></div>
    </div>
    <!-- 貼文互動列複製 icon(post-icon.js)的統計磚:標籤直接沿用篩選 chip
         已有的 opKindIcon key(「貼文按鈕」)，不另造新 key。 -->
    <div class="tile">
      <div class="label"><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="opKindIcon">貼文按鈕</span></div>
      <div class="value" id="statIcon">0</div>
      <div class="meta" id="statIconMeta"></div>
    </div>
  </section>

  <!-- 圖表 + 設定 -->
  <section class="duo">
    <div class="card chart-card">
      <div class="card-head">
        <h2 data-i18n="opChartTitle">近 14 天活動</h2>
        <span class="hint" data-i18n="opChartUnit">單位:次</span>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <svg id="chart" viewBox="0 0 560 230" role="img" aria-labelledby="chartDesc"></svg>
        <div class="tooltip" id="chartTip"></div>
        <span id="chartDesc" class="sr-only" data-i18n="opChartDesc">近 14 天每日活動次數</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2 data-i18n="opSettingsTitle">設定</h2></div>
      <div class="settings-body">
        <label class="setting-row" for="autoClean">
          <span class="txt">
            <span class="name" data-i18n="opAutoCleanName">自動淨化分享按鈕</span>
            <div class="desc" data-i18n="opAutoCleanDesc">複製時自動換成乾淨網址；關閉仍照常寫入紀錄。</div>
          </span>
          <input type="checkbox" id="autoClean" class="switch" />
        </label>
        <!-- 與 popup 的 postCopyEnabled 鏡像，設定頁保留完整開關說明
             (popup 只留精簡標籤)。 -->
        <label class="setting-row" for="postCopyEnabled">
          <span class="txt">
            <span class="name" data-i18n="opPostCopyName">貼文複製按鈕</span>
            <div class="desc" data-i18n="opPostCopyDesc">在貼文互動列顯示複製連結按鈕</div>
          </span>
          <input type="checkbox" id="postCopyEnabled" class="switch" />
        </label>
        <label class="setting-row" for="saveHistory">
          <span class="txt">
            <span class="name" data-i18n="opSaveName">保存紀錄</span>
            <div class="desc" data-i18n="opSaveDesc">僅存於本機</div>
          </span>
          <input type="checkbox" id="saveHistory" class="switch" />
        </label>
      </div>
    </div>
  </section>

  <!-- 紀錄清單為卡片牆，單一 view 直接顯示，不分頁 tab。 -->
  <section class="card history">
    <div class="card-head">
      <h2 data-i18n="opHistoryTitle">紀錄</h2>
      <div class="menu-wrap">
        <span class="page-size" id="pageSizeSel"><span data-i18n="opPerPageA">每頁</span>
          <button class="ps on" data-n="20">20</button>
          <button class="ps" data-n="50">50</button>
          <button class="ps" data-n="100">100</button>
        <span data-i18n="opPerPageB">筆</span></span>
        <button class="ghost-btn" id="moreBtn" data-i18n-title="opMoreTitle" title="更多動作" aria-haspopup="menu" aria-expanded="false">
          <svg class="icon"><use href="#i-more"/></svg>
        </button>
        <div class="menu" id="moreMenu" hidden role="menu">
          <button class="menu-item" id="exportBtn" role="menuitem">
            <svg class="icon"><use href="#i-download"/></svg><span data-i18n="opExportJson">匯出 JSON</span>
          </button>
          <button class="menu-item" id="importBtn" role="menuitem">
            <svg class="icon"><use href="#i-upload"/></svg><span data-i18n="opImportJson">匯入 JSON</span>
          </button>
          <hr class="menu-sep" />
          <button class="menu-item danger" id="clearBtn" role="menuitem">
            <svg class="icon"><use href="#i-trash"/></svg><span data-i18n="opClearAll">清除全部紀錄</span>
          </button>
        </div>
      </div>
    </div>
    <div class="history-tools">
      <div class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="search" id="searchInput" data-i18n-ph="opSearchPh" placeholder="搜尋帳號或網址…" />
      </div>
      <div class="menu-wrap">
        <button class="ghost-btn" id="filterBtn" data-i18n-title="opFilterTitle" title="依來源篩選" aria-expanded="false" aria-controls="chipsRow">
          <svg class="icon"><use href="#i-filter"/></svg>
        </button>
        <div class="menu chips-menu" id="chipsRow" hidden>
          <div class="chips" id="chips">
            <button class="chip on" data-kind="all" data-i18n="opChipAll">全部</button>
            <button class="chip" data-kind="share" data-i18n="opKindShare">短碼解析</button>
            <button class="chip" data-kind="strip" data-i18n="opKindStrip">剪除參數</button>
            <button class="chip" data-kind="menu" data-i18n="opKindMenu">右鍵還原</button>
            <button class="chip" data-kind="icon" data-i18n="opKindIcon">貼文按鈕</button>
          </div>
        </div>
      </div>
    </div>
    <div class="entry-grid" id="rows"></div>
    <div class="empty" id="empty" hidden>
      <svg class="icon"><use href="#i-history"/></svg>
      <div data-i18n="opEmpty">沒有符合條件的紀錄</div>
    </div>
    <div class="list-foot">
      <span id="countHint"></span>
      <!-- 雲端同步狀態切換這一列的文案(options.js 的 renderSyncCard):未
           登入維持既有「僅保存於這台裝置」承諾，已登入換成「已同步至你的
           Google 帳號」。data-i18n 提供未登入態的初值，已登入態由 JS
           顯式覆寫(比照 confirmTitleText 等既有做法)。 -->
      <span id="deviceNote" data-i18n="opDeviceNote">紀錄僅保存於這台裝置</span>
    </div>
  </section>

  <footer class="about">
    <a href="https://github.com/hunandy14/threads-clean-link" target="_blank" rel="noreferrer noopener">
      <svg class="icon"><use href="#i-github"/></svg>hunandy14/threads-clean-link
    </a>
    <span>MIT License</span>

<div class="toast" id="toast"></div>

<!-- 匯入對話框(匯出改為直接下載檔案，不經對話框) -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"><svg class="icon"><use href="#i-upload"/></svg><span data-i18n="opImportTitle">匯入紀錄</span></h3>
    <div class="desc" data-i18n="opImportDesc">選擇先前匯出的 .json 檔，或直接貼上內容;與現有紀錄以網址去重合併。</div>
    <textarea id="modalText" spellcheck="false" placeholder='{ "app": "threads-clean-link", "version": 1, "entries": [ … ] }'></textarea>
    <div class="modal-actions">
      <button class="btn" id="modalClose" data-i18n="opClose">關閉</button>
      <button class="btn" id="modalFile">
        <svg class="icon"><use href="#i-upload"/></svg><span data-i18n="opChooseFile">選擇檔案</span>
      </button>
      <button class="btn btn-primary" id="modalPrimary" data-i18n="opDoImport">匯入</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden />
  </div>
</div>

<!-- 清除全部:確認對話框 -->
<div class="overlay" id="confirmOverlay" hidden>
  <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <h3 id="confirmTitle"><svg class="icon danger-ink" id="confirmIcon"><use href="#i-trash" id="confirmIconUse"/></svg><span id="confirmTitleText" data-i18n="opClearAll">清除全部紀錄</span></h3>
    <div class="desc" id="confirmDesc"></div>
    <div class="modal-actions">
      <button class="btn" id="confirmCancel" data-i18n="opCancel">取消</button>
      <button class="btn btn-danger-solid" id="confirmOk" data-i18n="opClearDo">確定清除</button>
    </div>
  </div>
</div>

<!-- 卡片詳細視窗:結構/行為/間距/字級/圓角/按鈕樣式一律照手機版
     history-detail-dialog.tsx + dialog-shell.tsx 的字面 token 值(唯一
     數值權威，見上方 :root 註解)。點卡片本身開啟，✕ 鈕或點遮罩或 Esc
     關閉。sr-only 標題供螢幕閱讀器用，視覺上不畫額外標題列，直接從卡頭
     (徽章/時間)開始。original/removedParams 兩列缺席容忍——沒資料就不
     畫，見 detailExtraRows/buildDetailExtraRows。 -->
<div class="overlay" id="detailOverlay" hidden>
  <div class="modal modal-detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <h3 id="detailTitle" class="sr-only" data-i18n="opDetailTitle">紀錄詳細資訊</h3>
    <!-- ✕ 關閉鈕，對齊 dialog-shell.tsx 的 DialogCloseButton。 -->
    <button class="detail-close" id="detailClose" data-i18n-title="opClose" data-i18n-aria="opClose" title="關閉" aria-label="關閉">✕</button>
    <div class="detail-head">
      <div class="entry-meta">
        <span class="entry-badge" id="detailBadge"></span>
        <span class="entry-time" id="detailTime"></span>
      </div>
      <div class="detail-author-row" id="detailAuthorRow" hidden>
        <span class="detail-author-name" id="detailAuthorName"></span>
        <span class="detail-handle" id="detailHandle"></span>
      </div>
      <!-- 15 行截斷，對齊手機版 EXCERPT_DIALOG_LINES;超長時「展開全文」
           原地移除截斷(手機版是巢狀開第二層 Modal，理由是 RN 在 iOS 不
           支援兄弟層 Modal 並開——web 沒有這個限制，原地展開行為等價、
           實作更簡單;時間軸則反過來改回巢狀子層，見下方 timelineOverlay
           的註解)。 -->
      <div class="detail-excerpt" id="detailExcerpt" hidden></div>
      <button class="link-btn" id="detailExpandBtn" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg>
        <span data-i18n="opExpandFull">展開全文</span>
      </button>
      <div id="detailUrlFallback" hidden></div>
    </div>

    <!-- 淨化後連結 kv:標籤在上、數值+複製鈕同一列在下，照手機版 CopyRow
         的 styles.kv/.linkRow 堆疊排版(不是左標籤右數值並排);值顯示
         formatDisplayUrl 後的正規路徑(@handle/post/ID)，accent 強調。 -->
    <div class="detail-kv">
      <span class="detail-key" data-i18n="opUrlLabel">淨化後連結</span>
      <div class="detail-linkrow">
        <span class="detail-value ellipsis" id="detailUrlValue"></span>
        <button class="copy-btn" id="detailUrlCopyBtn" data-i18n="opCopyShort">複製</button>
      </div>
    </div>

    <!-- 原始連結/追蹤參數列(有資料才畫，見 buildDetailExtraRows)。 -->
    <div id="detailExtraRows"></div>

    <!-- 記錄時間 kv:seen.length > 1 時才出現「時間軸」鈕，防禦寫法見
         openEntryDetail/buildSeenTimeline;點下去開時間軸子層視窗
         (timelineOverlay)，不是原地展開。 -->
    <div class="detail-kv">
      <span class="detail-key" data-i18n="opRecordedTime">記錄時間</span>
      <div class="detail-linkrow">
        <span class="detail-value" id="detailRecordedTime"></span>
        <button class="copy-btn" id="detailTimelineBtn" hidden data-i18n="opTimelineBtn">時間軸</button>
      </div>
    </div>

    <!-- 底部動作列:對齊 DialogActions/DialogButton，等寬、outline 邊框，
         destructive 只變文字色(不是實心底色)。 -->
    <div class="dialog-actions">
      <button class="dialog-btn" id="detailCopyBtn" data-i18n="opCopyTitle">複製乾淨網址</button>
      <a class="dialog-btn" id="detailOpenLink" target="_blank" rel="noopener" data-i18n="opOpenTitle">開啟貼文</a>
      <button class="dialog-btn destructive" id="detailDeleteBtn" data-i18n="opDeleteTitle">刪除這筆</button>
    </div>
  </div>
</div>

<!-- 時間軸子層視窗，照手機版 history-detail-dialog.tsx 的 showSeenHistory
     分支——疊在詳細視窗上，標題「解析時間軸(共 N 次)」含次數、右上 ✕
     關閉。手機版時間軸本來就是巢狀 Modal，沒有「展開全文」那條 iOS
     平台限制要迴避，故照抄巢狀結構，不用原地展開。 -->
<div class="overlay" id="timelineOverlay" hidden>
  <div class="modal modal-detail" role="dialog" aria-modal="true" aria-labelledby="timelineTitle">
    <button class="detail-close" id="timelineClose" data-i18n-title="opClose" data-i18n-aria="opClose" title="關閉" aria-label="關閉">✕</button>
    <h3 id="timelineTitle" class="detail-author-name"></h3>
    <div id="detailTimeline"></div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="tcl-core.js"></script>
<script src="options.js"></script>
<script src="options-init.js"></script>
</body>
</html>
